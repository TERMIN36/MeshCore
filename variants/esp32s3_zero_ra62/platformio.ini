; ESP32-S3 Zero + HT-RA62. Pins match the working nibble_screen_connect ini:
; NSS=2 SCK=5 MOSI=3 MISO=4 BUSY=6 DIO1=7 RESET=8
; SSD1306 SDA=12 SCL=13, BOOT on GPIO0, TX LED on the onboard NeoPixel GPIO21.

[esp32s3_zero_ra62_base]
extends = esp32s3_base
board = esp32-s3-zero
board_build.partitions = min_spiffs.csv
; ESP32-S3FH4R2: 4MB quad flash, 2MB octal PSRAM. The web page is a 64KB
; allocation; internal RAM has no contiguous block that large once Wi-Fi is up.
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
build_flags =
  ${esp32_base.build_flags}
  -I variants/esp32s3_zero_ra62
  -D ESP32S3_ZERO_RA62
  -D BOARD_HAS_PSRAM
  -D P_LORA_TX_NEOPIXEL_LED=21
  -D P_LORA_NSS=2
  -D P_LORA_SCLK=5
  -D P_LORA_MOSI=3
  -D P_LORA_MISO=4
  -D P_LORA_BUSY=6
  -D P_LORA_DIO_1=7
  -D P_LORA_RESET=8
  -D PIN_USER_BTN=0
  -D PIN_BOARD_SDA=12
  -D PIN_BOARD_SCL=13
  -D DISPLAY_ROTATION=0
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_RX_BOOSTED_GAIN=1
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/esp32s3_zero_ra62>
lib_deps =
  ${esp32_base.lib_deps}
  adafruit/Adafruit SSD1306 @ ^2.5.13

[env:esp32s3_zero_ra62_repeater]
extends = esp32s3_zero_ra62_base
build_flags =
  ${esp32s3_zero_ra62_base.build_flags}
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"RA62 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${esp32s3_zero_ra62_base.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${esp32s3_zero_ra62_base.lib_deps}
  ${esp32_ota.lib_deps}
