name: Release

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:

  check-version:
    runs-on: ubuntu-latest
    steps:

      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment
        with:
          pm_frameworks: false

      - name: Check Tag Matches Source Version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          SOURCE_VERSION=$(/usr/bin/env bash build.sh get-version)
          TAG="${{ github.ref_name }}"
          case "$TAG" in
            "$SOURCE_VERSION"|"$SOURCE_VERSION"-rc*|"$SOURCE_VERSION"-beta*|"$SOURCE_VERSION"-alpha*) ;;
            *)
              echo "::error::Tag $TAG does not match $SOURCE_VERSION from src/helpers/FirmwareVersion.h"
              exit 1
              ;;
          esac

  companion:
    needs: check-version
    uses: ./.github/workflows/firmware-builder.yml
    with:
      firmware_type: companion
      release_title_prefix: Companion Firmware
      publish: false
      batch_size: 6
      embed_git_tag_version: false
      # Device-facing string; repo tag stays v0.2.0-rc4 without the termin36 prefix.
      firmware_version: ${{ startsWith(github.ref, 'refs/tags/v') && 'termin36-v0.2.0-rc4' || '' }}

  repeater:
    needs: check-version
    uses: ./.github/workflows/firmware-builder.yml
    with:
      firmware_type: repeater
      release_title_prefix: Repeater Firmware
      publish: false
      batch_size: 6
      embed_git_tag_version: false
      firmware_version: ${{ startsWith(github.ref, 'refs/tags/v') && 'termin36-v0.2.0-rc4' || '' }}

  room-server:
    needs: check-version
    uses: ./.github/workflows/firmware-builder.yml
    with:
      firmware_type: room-server
      release_title_prefix: Room Server Firmware
      publish: false
      batch_size: 6
      embed_git_tag_version: false
      firmware_version: ${{ startsWith(github.ref, 'refs/tags/v') && 'termin36-v0.2.0-rc4' || '' }}

  create-release:
    needs: [check-version, companion, repeater, room-server]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.check-version.result == 'success' && needs.companion.result == 'success' && needs.repeater.result == 'success' && needs.room-server.result == 'success' }}
    steps:

      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: out

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: "MeshCore Termin36 ${{ github.ref_name }}"
          body_path: .github/release-notes.md
          generate_release_notes: true
          draft: false
          # every tag has a dash (v1.17.1-0.1.1), only -rc/-beta/-alpha suffixes mark a prerelease
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          make_latest: ${{ !(contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha')) }}
          files: out/*
          fail_on_unmatched_files: true
