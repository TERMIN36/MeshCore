name: Release

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/**'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:

  check-version:
    runs-on: ubuntu-latest
    outputs:
      firmware_version: ${{ steps.device_version.outputs.version }}
    steps:

      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment
        with:
          pm_frameworks: false

      - name: Check version and set device-facing FIRMWARE_VERSION
        id: device_version
        run: |
          set -euo pipefail
          REF="${{ github.ref }}"
          NAME="${{ github.ref_name }}"
          if [[ "$REF" == refs/tags/v* ]]; then
            TAG="$NAME"
          elif [[ "$NAME" == release/* ]]; then
            TAG="v${NAME#release/}"
          else
            echo "::error::Release workflow expects tag v* or branch release/* (got $REF)"
            exit 1
          fi
          SOURCE_VERSION=$(/usr/bin/env bash build.sh get-version)
          case "$TAG" in
            "$SOURCE_VERSION"|"$SOURCE_VERSION"-rc*|"$SOURCE_VERSION"-beta*|"$SOURCE_VERSION"-alpha*) ;;
            *)
              echo "::error::Version $TAG does not match $SOURCE_VERSION from src/helpers/FirmwareVersion.h"
              exit 1
              ;;
          esac
          case "$TAG" in
            *-rc*|*-beta*|*-alpha*) FV="t36-${TAG}" ;;
            *) FV="termin36-${TAG}" ;;
          esac
          if [ "${#FV}" -gt 20 ]; then
            echo "::error::Device-facing FIRMWARE_VERSION is ${#FV} characters (max 20): $FV"
            exit 1
          fi
          echo "version=${FV}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: ${TAG}"
          echo "FIRMWARE_VERSION=${FV}"

  companion:
    needs: check-version
    uses: ./.github/workflows/firmware-builder.yml
    with:
      firmware_type: companion
      release_title_prefix: Companion Firmware
      publish: false
      batch_size: 6
      embed_git_tag_version: false
      firmware_version: ${{ needs.check-version.outputs.firmware_version }}

  repeater:
    needs: check-version
    uses: ./.github/workflows/firmware-builder.yml
    with:
      firmware_type: repeater
      release_title_prefix: Repeater Firmware
      publish: false
      batch_size: 6
      embed_git_tag_version: false
      firmware_version: ${{ needs.check-version.outputs.firmware_version }}

  room-server:
    needs: check-version
    uses: ./.github/workflows/firmware-builder.yml
    with:
      firmware_type: room-server
      release_title_prefix: Room Server Firmware
      publish: false
      batch_size: 6
      embed_git_tag_version: false
      firmware_version: ${{ needs.check-version.outputs.firmware_version }}

  create-release:
    needs: [check-version, companion, repeater, room-server]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.check-version.result == 'success' && needs.companion.result == 'success' && needs.repeater.result == 'success' && needs.room-server.result == 'success' }}
    steps:

      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: out

      # One zip per role avoids GitHub secondary rate limits from hundreds of asset uploads.
      - name: Pack role bundles
        run: |
          set -euo pipefail
          VER="${{ github.ref_name }}"
          mkdir -p bundles/companion bundles/repeater bundles/room-server
          shopt -s nullglob
          unclassified=0
          for f in out/*; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            base_lc=$(printf '%s' "$base" | tr '[:upper:]' '[:lower:]')
            case "$base_lc" in
              *companion*) dest=bundles/companion ;;
              *room_server*|*room-server*) dest=bundles/room-server ;;
              *repeater*) dest=bundles/repeater ;;
              *.h|firmwarebuildinfo.h)
                # build metadata accidentally under out/ — ignore
                rm -f "$f"
                continue
                ;;
              *)
                echo "::warning::Unclassified firmware file: $base"
                unclassified=$((unclassified + 1))
                continue
                ;;
            esac
            mv "$f" "$dest/"
          done
          for role in companion repeater room-server; do
            count=$(find "bundles/$role" -type f | wc -l)
            if [ "$count" -lt 1 ]; then
              echo "::error::No firmware files for role $role"
              exit 1
            fi
            echo "Packing $role ($count files)"
            (cd "bundles/$role" && zip -q -r "../../${role}-${VER}.zip" .)
            ls -lh "${role}-${VER}.zip"
          done
          if [ "$unclassified" -gt 0 ]; then
            echo "::error::$unclassified unclassified file(s) left in out/"
            ls -la out/ || true
            exit 1
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: "MeshCore Termin36 ${{ github.ref_name }}"
          body_path: .github/release-notes.md
          generate_release_notes: true
          draft: false
          # every tag has a dash (v1.17.1-0.1.1), only -rc/-beta/-alpha suffixes mark a prerelease
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          make_latest: ${{ !(contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha')) }}
          files: |
            companion-${{ github.ref_name }}.zip
            repeater-${{ github.ref_name }}.zip
            room-server-${{ github.ref_name }}.zip
          fail_on_unmatched_files: true
