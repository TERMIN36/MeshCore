name: Release

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:

  generate-build-matrix:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.get-build-targets.outputs.targets }}
    steps:

      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Check Tag Matches Source Version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          SOURCE_VERSION=$(/usr/bin/env bash build.sh get-version)
          TAG="${{ github.ref_name }}"
          case "$TAG" in
            "$SOURCE_VERSION"|"$SOURCE_VERSION"-rc*|"$SOURCE_VERSION"-beta*|"$SOURCE_VERSION"-alpha*) ;;
            *)
              echo "::error::Tag $TAG does not match $SOURCE_VERSION from src/helpers/FirmwareVersion.h"
              exit 1
              ;;
          esac

      - name: Get Build Targets
        id: get-build-targets
        run: |
          TARGET_LIST=$(
            /usr/bin/env bash build.sh get-companion-firmwares-to-build
            /usr/bin/env bash build.sh get-repeater-firmwares-to-build
            /usr/bin/env bash build.sh get-room-server-firmwares-to-build
          )
          JSON_ARRAY=$(echo "$TARGET_LIST" | jq -R -s -c 'split("\n") | map(select(length > 0)) | unique')
          echo "Targets: $(echo "$JSON_ARRAY" | jq length)"
          echo "targets=$JSON_ARRAY" >> $GITHUB_OUTPUT

  build:
    needs: generate-build-matrix
    runs-on: ubuntu-latest
    continue-on-error: true # one broken board must not block the release
    strategy:
      matrix:
        target: ${{ fromJson(needs.generate-build-matrix.outputs.targets) }}
      fail-fast: false
    steps:

      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Build Firmware
        env:
          # tag builds embed the tag, manual runs fall back to the version in the source
          FIRMWARE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          /usr/bin/env bash build.sh build-firmware ${{ matrix.target }}
          ls out/* > /dev/null # fail the job when the board produced no files

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: "${{ matrix.target }}"
          path: out
          if-no-files-found: ignore

  create-release:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    steps:

      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: out

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: "MeshCore Termin36 ${{ github.ref_name }}"
          body_path: .github/release-notes.md
          generate_release_notes: true
          draft: false
          # every tag has a dash (v1.17.1-0.1.1), only -rc/-beta/-alpha suffixes mark a prerelease
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          make_latest: ${{ !(contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha')) }}
          files: out/*
          fail_on_unmatched_files: true
